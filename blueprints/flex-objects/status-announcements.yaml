title: Status Announcements
description: Incident, maintenance, and informational posts shown on the public status page, scoped to one or more categories.
type: flex-objects

# Flex Configuration
config:
  # Administration Configuration
  admin:
    # Admin router
    router:
      path: '/status-announcements'

    # Admin menu
    menu:
      list:
        route: '/status-announcements'
        title: Status Announcements
        icon: fa-bullhorn
        # Authorization to collection admin
        authorize: ['admin.status-announcements.list', 'admin.super']
        priority: 2

    # Admin template type / folder
    template: default

    # Permissions -- flex-objects >= 1.4.3 denies by default without this block.
    permissions:
      admin.status-announcements:
        type: crudl
        label: Status Announcements
      api.status-announcements:
        type: crudl
        label: Status Announcements API

    # List view
    list:
      title: title
      fields:
        title:
          link: edit
        state:
        severity:
        started_at:
        ended_at:

    # Edit view
    edit:
      title:
        template: "{{ object.title }}"

    # Preview view
    preview:
      enabled: false

  # Site Configuration
  site:
    hidden: true

  # Data Configuration
  data:
    object: 'Grav\Plugin\StatusPage\Flex\Types\StatusAnnouncement\StatusAnnouncementObject'
    collection: 'Grav\Plugin\StatusPage\Flex\Types\StatusAnnouncement\StatusAnnouncementCollection'
    index: 'Grav\Plugin\StatusPage\Flex\Types\StatusAnnouncement\StatusAnnouncementIndex'
    storage:
      # One YAML file per announcement -- readable diffs, cheap to hand-edit.
      class: 'Grav\Framework\Flex\Storage\FileStorage'
      options:
        formatter:
          class: 'Grav\Framework\File\Formatter\YamlFormatter'
        # CRITICAL: user-data:// is the one part of Grav's plugin-adjacent
        # surface that is both persistent and not seed-shadowed on the
        # production volume. plugin:// would lose all incident history on
        # every redeploy, silently. Pinned by tests/FlexStoragePathTest.php.
        folder: 'user-data://flex-objects/status-announcements'
        pattern: '{FOLDER}/{KEY}{EXT}'
        indexed: true
        case_sensitive: false
    search:
      options:
        contains: 1
      fields:
        - title
        - state
        - severity

# Regular form definition
form:
  validation: strict

  fields:
    title:
      type: text
      label: Title
      validate:
        required: true

    body:
      type: markdown
      label: Body
      validate:
        required: false

    state:
      type: select
      label: State
      default: active
      options:
        active: Active
        watching: Watching
        resolved: Resolved
      validate:
        required: true

    severity:
      type: select
      label: Severity
      help: 'A maintenance or informational post should use "None" -- it is the default and colors no day on the history strip. Only Partial outage / Outage feed the uptime calculation.'
      default: none
      options:
        none: None
        partial-outage: Partial outage
        outage: Outage
      validate:
        required: true

    categories:
      type: select
      multiple: true
      size: large
      label: Categories
      classes: fancy
      # KNOWN COSMETIC ISSUE, TRIED AND CONFIRMED NOT THE CAUSE: an existing
      # announcement's selected-category chips show the raw key instead of
      # the resolved title on edit, even though the stored value, the
      # dropdown's own labels, and a freshly-picked chip in the same
      # session are all correct.
      #  1. Removing `classes: fancy` had zero visible effect on a live
      #     install with the change confirmed deployed.
      #  2. Flipping `options()`'s map to title => key made display and
      #     persistence consistent, but consistently wrong (raw key
      #     everywhere) -- worse than the status quo.
      #  3. Returning `options()` as an array of `{value, label}` objects
      #     directly (instead of a `key => title` map) broke creating AND
      #     editing entirely ("Failed to load blueprint"): confirmed by
      #     reading `BlueprintController::serializeFields()` in full that it
      #     *already* converts a resolved `key => title` map into that exact
      #     array shape itself, right after resolving `data-options@`.
      #     Handing it the array shape directly makes that conversion run
      #     twice, stringifying each `{value, label}` pair as a scalar via
      #     PHP's array-to-string conversion -- a warning this environment's
      #     error handler escalates into a fatal exception. See the
      #     docblock on `CategoryOptions::options()` for the full finding.
      # `CategoryOptions::normalizeToKeys()` guarantees correct persistence
      # regardless of what the form happens to display.
      # Dynamic option provider -- registered via
      # Blueprint::addAllowedDynamicCallable() in
      # StatusPagePlugin::onPluginsInitialized(), otherwise Grav's dynamic-
      # callable allowlist (GHSA-fj2p-qj2f-74v5) silently returns no options.
      data-options@: 'Grav\Plugin\StatusPage\CategoryOptions::options'
      # `commalist` (a comma-separated-string validator, meant for a plain
      # text/tag field) was the wrong type for a keyed multi-select and is
      # the confirmed root cause of a real bug: submitted through Admin2,
      # this field stored the selected categories' *display titles*
      # ("AI Features") instead of their machine keys ("ai-features"),
      # silently breaking every key-based lookup downstream (the category
      # badge on this announcement, and StatusProjector's category
      # matching -- an active outage never colored its category or the
      # overall banner). `array` is the correct validator for a
      # `type: select, multiple: true` field's submitted value.
      validate:
        required: true
        type: array

    started_at:
      type: datetime
      label: Started at
      validate:
        required: true

    ended_at:
      type: datetime
      label: Ended at
      help: Required once State is set to Resolved. Must not be earlier than Started at.
      validate:
        required: false
